name: Phase 10 Live Routing Patch

on:
  push:
    branches:
      - "agent/phase-10-live-agent-routing"
    paths:
      - "tools/phase10_apply_patch.py"
      - ".github/workflows/phase10-live-routing-patch.yml"

permissions:
  contents: write

concurrency:
  group: phase10-live-routing-patch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Phase 10 branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-10-live-agent-routing
          fetch-depth: 0

      - name: Apply exact integration patch
        run: python3 tools/phase10_apply_patch.py

      - name: Commit patched production files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No patch changes to commit"
            exit 0
          fi
          git commit -m "Integrate hierarchical WorkOrders into live task pipeline"
          git push origin HEAD:agent/phase-10-live-agent-routing
