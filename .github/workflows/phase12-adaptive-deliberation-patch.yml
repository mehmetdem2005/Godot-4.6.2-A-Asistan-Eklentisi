name: Phase 12 Adaptive Deliberation Patch

on:
  push:
    branches:
      - "agent/phase-12-adaptive-deep-deliberation"
    paths:
      - "tools/phase12_apply_patch.py"
      - ".github/workflows/phase12-adaptive-deliberation-patch.yml"

permissions:
  contents: write

concurrency:
  group: phase12-adaptive-deliberation-patch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Phase 12 branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-12-adaptive-deep-deliberation
          fetch-depth: 0

      - name: Apply exact adaptive integration patch
        run: python3 tools/phase12_apply_patch.py

      - name: Commit patched production files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No patch changes to commit"
            exit 0
          fi
          git commit -m "Integrate adaptive parallel deep deliberation"
          git push origin HEAD:agent/phase-12-adaptive-deep-deliberation
