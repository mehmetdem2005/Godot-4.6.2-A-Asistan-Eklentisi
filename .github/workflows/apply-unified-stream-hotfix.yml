name: Apply Unified Stream Hotfix

on:
  pull_request:
    branches:
      - "claude/godot-ai-game-builder-FRhQk"
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: apply-unified-stream-hotfix-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply exact hotfix
        run: python3 tools/apply_unified_stream_hotfix.py

      - name: Commit production changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix unified stream timeline and null SSE chunks"
          git push origin HEAD:${GITHUB_HEAD_REF}
