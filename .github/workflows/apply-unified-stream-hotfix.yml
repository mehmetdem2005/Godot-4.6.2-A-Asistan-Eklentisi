name: Apply Unified Stream Hotfix

on:
  pull_request:
    branches:
      - "claude/godot-ai-game-builder-FRhQk"
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: apply-unified-stream-hotfix-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply exact hotfix
        run: python3 tools/apply_unified_stream_hotfix.py

      - name: Commit only production files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The GitHub App cannot push workflow mutations. Keep CI/test/manifest
          # files unchanged and commit only the two production fixes.
          git restore --source=HEAD -- \
            .github/workflows/godot-4.6.3-quality-gate.yml \
            .github/workflows/apply-unified-stream-hotfix.yml \
            tools/apply_unified_stream_hotfix.py \
            release/readiness_manifest.json \
            addons/ai_assistant/router/_deepseek_reasoning_stream_test.gd \
            addons/ai_assistant/pilot_cell/_phase13_live_workspace_test.gd

          git add \
            addons/ai_assistant/ai_studio_screen.gd \
            addons/ai_assistant/router/streaming_http_transport.gd
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No production changes to commit"
            exit 0
          fi
          git commit -m "Fix unified stream timeline and null SSE chunks"
          git push origin HEAD:${GITHUB_HEAD_REF}
